name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # GATE-05 in CLAUDE.md / scripts/release-verification.ts is
      # --audit-level=critical. Lower severities are tracked, not blocking.
      - name: Security audit (critical severity)
        run: npm audit --audit-level=critical

      - name: Legacy design-token / button.tsx migration audit
        run: node scripts/audit-dependencies.cjs

  build:
    name: Build
    runs-on: ubuntu-latest
    # Only build on main and PRs to main — saves CI minutes on feature branches
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    env:
      # src/content/sanity/env.ts throws at module load without these, which
      # fails page-data collection for every route. They are NEXT_PUBLIC_ —
      # they ship in the client bundle and are not secrets — so they are
      # repository variables, not secrets.
      #
      # The placeholders are deliberate: with no reachable Sanity project the
      # build falls through to src/content/fallback/, so CI also proves the
      # offline-resilience path still renders all 69 routes. Set the repo
      # variables to build against real content instead.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'dummyprojectid' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `prebuild` re-syncs the pdf.js runtime assets with --check, so a build
      # fails here rather than at render time if public/pdfjs has drifted.
      - name: Build
        run: npm run build
