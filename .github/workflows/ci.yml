name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # GATE-05 in CLAUDE.md / scripts/release-verification.ts is
      # --audit-level=critical. Lower severities are tracked, not blocking.
      - name: Security audit (critical severity)
        run: npm audit --audit-level=critical

      # .agents/rules/coding.md and CLAUDE.md both hold src/ to zero
      # console.log. CI referenced this check for months at
      # apps/web/scripts/checks/no-console-log.js — a path that has never
      # existed here — so it only ever failed with MODULE_NOT_FOUND and the
      # rule went unenforced. Script recovered from a7f619e.
      - name: No console.log in production source
        run: node scripts/checks/no-console-log.js

      - name: Legacy design-token / button.tsx migration audit
        run: node scripts/audit-dependencies.cjs

  build:
    name: Build
    runs-on: ubuntu-latest
    # Only build on main and PRs to main — saves CI minutes on feature branches
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    env:
      # NEXT_PUBLIC_ values ship verbatim in the client bundle — not secrets.
      # Hardcoded here so CI doesn't require repository variables to be set.
      # Without SANITY_API_TOKEN the Sanity client returns no data and the
      # build falls through to src/content/fallback/, proving offline resilience.
      NEXT_PUBLIC_SANITY_PROJECT_ID: gfwqxrd2
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `prebuild` re-syncs the pdf.js runtime assets with --check, so a build
      # fails here rather than at render time if public/pdfjs has drifted.
      - name: Build
        run: npm run build
