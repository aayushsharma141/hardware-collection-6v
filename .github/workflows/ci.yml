name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

# This repository is a single npm package (`name: "website"`) at the root, not
# a workspace monorepo. Every step below runs at the root; `--workspace=web`
# and `--workspace=apps/web` resolve to nothing and fail the job outright.
env:
  NODE_VERSION: "22.x"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # GATE-05 in CLAUDE.md is `npm audit --audit-level=critical`, and it
      # passes. `high` does not: the tree currently carries 10 high advisories,
      # which is why this step was pinned behind continue-on-error. The
      # security workflow still reports the highs without blocking.
      - name: Security audit (critical severity)
        run: npm audit --audit-level=critical

      - name: No console.log in production source
        run: node scripts/checks/no-console-log.js

      - name: Unit tests
        run: npm test

      - name: Design-token and legacy-import audit
        run: npm run arch:check

  build:
    name: Build
    runs-on: ubuntu-latest
    # Only build on main and PRs to main — saves CI minutes on feature branches
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    env:
      # Sanity is read at module load (src/content/sanity/env.ts asserts both of
      # these), so the build aborts collecting page data for /api/seed when they
      # are unset. Real values belong in repository secrets; the fallbacks keep
      # the compile gate meaningful before those are configured, because every
      # Sanity fetch then fails closed onto src/content/fallback/ — the same
      # resilience path the site ships.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || 'ci-placeholder' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      NEXT_PUBLIC_SANITY_API_VERSION: "2024-02-12"
      # Prisma validates the URL shape at generate time; nothing in the build
      # opens a connection.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
