name: Key Rotation Reminder

# Rewritten for this project's actual credentials. The previous version asked
# quarterly for rotation of SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY —
# credentials this project does not have and never had. This stack is
# Next.js + Sanity + Prisma/Postgres, with Resend and Telegram for lead
# notifications, and it signs release evidence with an Ed25519 key.

on:
  schedule:
    # 00:00 on the 1st of January, April, July and October.
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create rotation tracking issue
        uses: imjohnbo/issue-bot@v3
        with:
          labels: "security, maintenance"
          title: "🔐 Quarterly credential rotation"
          body: |
            ### Quarterly credential rotation

            Automated reminder. See `.agents/security/KEY_ROTATION_STRATEGY.md`
            for the per-credential procedure.

            **Credentials in use by this project:**

            | Secret | Used by | Blast radius if leaked |
            |---|---|---|
            | `EVIDENCE_PRIVATE_KEY` | `scripts/evidence-engine.ts` | Release evidence bundles can be forged |
            | `SANITY_API_TOKEN` | `/api/seed`, `content/sanity/client.ts` | Read/write access to CMS content |
            | `SANITY_REVALIDATE_SECRET` | `/api/revalidate` | Forged cache-invalidation webhooks |
            | `DATABASE_URL` | `lib/leads/createLead.ts` | Full access to captured lead PII |
            | `RESEND_API_KEY` | `lib/leads/email.ts` | Send mail as the verified domain |
            | `TELEGRAM_BOT_TOKEN` | `lib/leads/telegram.ts` | Post to the staff alert channel |
            | `VERCEL_TOKEN` | `.github/workflows/deploy.yml` | Deploy arbitrary code to production |
            | `GOOGLE_SHEET_WEBHOOK_URL` | `/api/lead` | Write to the lead mirror sheet |

            **Checklist:**
            - [ ] Confirm `docs/evidence/private.key` is no longer tracked in git
                  (`git ls-files docs/evidence/private.key` must return nothing).
            - [ ] Rotate each credential above and update it in Vercel.
            - [ ] Update any that CI consumes in GitHub Secrets.
            - [ ] Verify a lead submission end to end (Postgres row + Telegram + email).
            - [ ] Verify the Sanity revalidation webhook still fires.
            - [ ] Close this issue on completion.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
