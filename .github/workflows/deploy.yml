name: Deploy to Vercel

on:
  push:
    branches:
      - main  # Auto-deploy to production when merging to main

jobs:
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
      VERCEL_ORG_ID: "${{ secrets.VERCEL_ORG_ID }}"
      VERCEL_PROJECT_ID: "${{ secrets.VERCEL_PROJECT_ID }}"
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # A push to main must not reach production if it would fail CI.
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Security audit (critical severity)
        run: npm audit --audit-level=critical

      - name: No console.log in production source
        run: node scripts/checks/no-console-log.js

      - name: Legacy design-token / button.tsx migration audit
        run: node scripts/audit-dependencies.cjs

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT=$(npx vercel --prod --archive=tgz --token="$VERCEL_TOKEN" 2>&1) || {
            printf '%s\n' "$DEPLOY_OUTPUT"
            exit 1
          }
          printf '%s\n' "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -oE 'https://[^[:space:]]+vercel\.app' | tail -1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            echo "Vercel command completed without a deployment URL; refusing to report success."
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"
