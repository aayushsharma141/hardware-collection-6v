name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Validate & deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: hoghkg00
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2024-02-12"
      SITE_INDEXABLE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Verify required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub environment secret $name is missing."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Security audit (critical severity)
        run: npm audit --audit-level=critical

      - name: No console.log in production source
        run: node scripts/checks/no-console-log.js

      - name: Dependency and design-token audit
        run: node scripts/audit-dependencies.cjs

      # Build before deployment. The build intentionally uses the public Sanity
      # project/dataset only; the write token and webhook secrets are not exposed
      # to this job. Content fallback keeps the build independent of private data.
      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Release acceptance E2E tests against production build
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
          SITE_INDEXABLE: "true"
        run: npx playwright test tests/e2e/release-acceptance.spec.ts --project=chromium

      - name: Deploy to Vercel (Production)
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$(mktemp)"
          if ! npx vercel --prod --archive=tgz --token="$VERCEL_TOKEN" 2>&1 | tee "$deploy_log"; then
            echo "::error::Vercel deployment command failed."
            exit 1
          fi

          deploy_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$deploy_log" | tail -n 1 || true)"
          if [[ -z "$deploy_url" ]]; then
            echo "::error::Vercel CLI exited without a detectable deployment URL; refusing to report success."
            exit 1
          fi

          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "Deployment created: $deploy_url"

      - name: Smoke test deployed URL
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          for path in / /collections; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$url$path")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Smoke test failed for $path (HTTP $status)."
              exit 1
            fi
            echo "PASS $path HTTP $status"
          done

      - name: Verify canonical production SEO headers and sitemap
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status=""
          for attempt in {1..6}; do
            status="$(curl --silent --show-error --location --dump-header "$headers" --output /dev/null --write-out '%{http_code}' --max-time 30 https://www.hardwarecollection.co/ || true)"
            if [[ "$status" == "200" ]]; then break; fi
            sleep 10
          done
          if [[ "$status" != "200" ]]; then
            echo "::error::Canonical production homepage returned HTTP ${status:-unknown}."
            exit 1
          fi
          if grep -qiE '^x-robots-tag:.*noindex' "$headers"; then
            echo "::error::Production homepage is sending X-Robots-Tag noindex. Set SITE_INDEXABLE=true in Vercel Production and redeploy."
            exit 1
          fi
          html="$(mktemp)"
          canonical_status="$(curl --silent --show-error --location --output "$html" --write-out '%{http_code}' --max-time 30 https://www.hardwarecollection.co/)"
          if [[ "$canonical_status" != "200" ]]; then
            echo "::error::Canonical production homepage HTML returned HTTP $canonical_status."
            exit 1
          fi
          if ! grep -qiF 'rel="canonical" href="https://www.hardwarecollection.co/"' "$html"; then
            echo "::error::Canonical homepage link does not point to https://www.hardwarecollection.co/."
            exit 1
          fi

          sitemap="$(mktemp)"
          sitemap_status="$(curl --silent --show-error --location --output "$sitemap" --write-out '%{http_code}' --max-time 30 https://www.hardwarecollection.co/sitemap.xml)"
          if [[ "$sitemap_status" != "200" ]]; then
            echo "::error::Production sitemap returned HTTP $sitemap_status."
            exit 1
          fi
          grep -q 'https://www.hardwarecollection.co/collections' "$sitemap" || {
            echo "::error::Sitemap is missing the canonical /collections URL."
            exit 1
          }
          if grep -q 'https://www.hardwarecollection.co/catalogues' "$sitemap"; then
            echo "::error::Sitemap still includes retired /catalogues route."
            exit 1
          fi

          legacy_headers="$(mktemp)"
          legacy_status="$(curl --silent --show-error --output /dev/null --dump-header "$legacy_headers" --write-out '%{http_code}' --max-time 30 'https://www.hardwarecollection.co/catalogues?brand=hafele')"
          if [[ "$legacy_status" != "307" && "$legacy_status" != "308" ]]; then
            echo "::error::Legacy /catalogues route should redirect to /collections (got HTTP $legacy_status)."
            exit 1
          fi
          grep -qiF 'location: https://www.hardwarecollection.co/collections?brand=hafele' "$legacy_headers" || {
            echo "::error::Legacy catalogue redirect did not preserve the brand query parameter."
            exit 1
          }
          echo "PASS production indexability, canonical host, sitemap, and legacy route redirect"
