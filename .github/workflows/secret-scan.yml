name: Secret Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # The action lists a pull request's commits, which the default read-only
    # token cannot do on a PR event: every run died with
    # "403 Resource not accessible by integration" on /pulls/{n}/commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
