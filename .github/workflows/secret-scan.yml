name: Secret Scan

# Both scanners run here. Note that neither caught docs/evidence/private.key,
# the tracked Ed25519 evidence signing key, because they scan newly pushed
# commits rather than the existing tree — the key was committed in 472af97 and
# has been tracked ever since. Until it is purged from history, a full-history
# scan is the only thing that will surface it: run
# `gitleaks detect --source . --log-opts="--all"` locally, or keep the
# scheduled full scan below.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly full-history sweep, which the per-push diff scans cannot do.
    - cron: '15 3 * * 1'

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
