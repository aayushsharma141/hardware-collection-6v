name: "Security Audits"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 2 * * 1'

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    # The scan itself runs fine, but uploading results needs GitHub code
    # scanning, which requires Advanced Security — unavailable on a private
    # repo owned by a personal account. The job therefore failed on upload
    # every single run ("Code scanning is not enabled for this repository")
    # and had never once produced an alert.
    #
    # Skipped while the repo is private. Make the repo public, or move it to
    # an org with Advanced Security, and this starts working again with no
    # edit. Secret scanning (TruffleHog), Gitleaks and the npm audit gate are
    # unaffected and still run on every PR.
    if: github.event.repository.visibility == 'public'
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  dependabot-audit:
    name: Dependabot NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Matches GATE-05 in CLAUDE.md. High and moderate findings are reported
      # by Dependabot and triaged there rather than blocking every PR.
      - name: Run NPM Audit
        run: npm audit --audit-level=critical

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # --ignore-npm-errors: `npm ls` exits non-zero on the pre-existing
      # @portabletext/editor peer range (wants react ^19.2.8, tree has 19.2.4).
      # That is a dependency-health matter for the audit job, not a reason to
      # withhold the inventory.
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format JSON --output-file bom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check for restricted licenses (GPL, AGPL)
        run: npx --yes license-checker --failOn "AGPL;GPL"
