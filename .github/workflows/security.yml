name: "Security Audits"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 2 * * 1'

# As in ci.yml: this is a single root package, so the `working-directory:
# apps/web` these jobs carried pointed at a directory that does not exist and
# failed every run within seconds.
env:
  NODE_VERSION: "22.x"

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  dependabot-audit:
    name: Dependabot NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Reports the high advisories without blocking. The blocking gate is
      # `--audit-level=critical` in ci.yml, per GATE-05 in CLAUDE.md. Drop the
      # continue-on-error once the current 10 highs are resolved.
      - name: Run NPM Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # cyclonedx-npm shells out to `npm ls --json --long --all`, which exits 1
      # with ELSPROBLEMS on this tree and aborts the SBOM: sharp's optional
      # wasm variants register as extraneous, and sanity's nested
      # @portabletext/editor wants react ^19.2.8 against the installed 19.2.4.
      # Neither is a CI concern — the second is a dependency decision — so the
      # generator is told to describe the tree as installed rather than refuse.
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format JSON --output-file bom.json
      # v3 is decommissioned: GitHub fails those runs automatically, which is
      # what this job had been doing rather than producing an SBOM.
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check for restricted licenses (GPL, AGPL)
        run: npx --yes license-checker --failOn "AGPL;GPL"
